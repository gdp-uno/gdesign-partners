name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/company-lp/staging
            git fetch origin develop
            git reset --hard origin/develop
            printf 'BASIC_AUTH_ENABLED=true\nSTAGING_MODE=true\n' > .env.local
            npm ci --production=false
            npm run build
            pm2 describe company-lp-staging > /dev/null 2>&1 \
              && pm2 restart company-lp-staging --update-env \
              || pm2 start npm --name "company-lp-staging" -- start -- -p 3001
            pm2 save
            sleep 5
            curl -fsS -u gdp2026:gdp2026 http://localhost:3001/lp/dx > /dev/null
