name: Deploy Goidou HP Proposal to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'goidou/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read nginx config and find writable paths
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== nginx sites-enabled ==="
            cat /etc/nginx/sites-enabled/* 2>/dev/null || cat /etc/nginx/conf.d/* 2>/dev/null
            echo "=== home dir ==="
            echo $HOME
            ls -la $HOME/
            echo "=== writable test ==="
            touch $HOME/test-write 2>/dev/null && echo "HOME writable" && rm $HOME/test-write
            touch /var/www/company-lp/staging/test-write 2>/dev/null && echo "company-lp writable" && rm /var/www/company-lp/staging/test-write
