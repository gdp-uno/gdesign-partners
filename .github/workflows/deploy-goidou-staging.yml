name: Deploy Goidou HP Proposal to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'goidou/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            goidou/HP_proposal/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/goidou-staging/HP_proposal/
