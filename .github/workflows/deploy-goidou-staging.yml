name: Deploy Goidou HP Proposal to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'goidou/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose server permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== USER ==="
            whoami
            echo "=== /var/www/goidou-staging/ ==="
            ls -la /var/www/ | grep goidou
            ls -la /var/www/goidou-staging/ 2>/dev/null || echo "goidou-staging does not exist or not accessible"
            echo "=== HP_proposal dir ==="
            ls -la /var/www/goidou-staging/HP_proposal/ 2>/dev/null | head -5 || echo "HP_proposal does not exist"
            echo "=== sudo check ==="
            sudo -n true 2>/dev/null && echo "sudo available" || echo "sudo NOT available"
