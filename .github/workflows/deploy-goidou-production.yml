name: Deploy Goidou HP Proposal to Production

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'goidou/**'

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            goidou/HP_proposal/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/goidou/HP_proposal/
