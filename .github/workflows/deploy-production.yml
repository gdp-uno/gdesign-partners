name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/company-lp/production
            git fetch origin main
            git reset --hard origin/main
            npm ci --production=false
            npm run build
            pm2 describe company-lp-production > /dev/null 2>&1 \
              && pm2 restart company-lp-production --update-env \
              || pm2 start npm --name "company-lp-production" -- start -- -p 3000
            pm2 save
            sleep 5
            curl -fsS http://localhost:3000/lp/dx > /dev/null
